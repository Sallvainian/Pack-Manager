[[entry]]
id = 65
type = "story"
title = "Export Exact Native Diagnostics and Visible Outcomes"
description = '''
CAP-6: Export diagnostics produces the documented timestamped ZIP - report.json, newest three app logs, newest 25 transcripts, operations.jsonl, and the raw plan-attempt record sets correlated by planAttemptId - proven through the production native command.

Story 6.5: Export Exact Native Diagnostics and Visible Outcomes (v6 epics.md text; its acceptance criteria are binding)

As a Pack-Manager user,
I want diagnostics export to create the documented archive and report native outcomes,
So that support evidence is complete, inspectable, and actionable.

**Story Contract:**

