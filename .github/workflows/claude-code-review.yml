name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Bot-authored PRs are skipped because the action hard-fails instead of
    # skipping them. claude[bot] is the deliberate exception so its PRs can
    # still receive the same review as a human-authored change.
    if: |
      !github.event.pull_request.draft &&
      !github.event.pull_request.merged &&
      (github.event.pull_request.user.type != 'Bot' ||
       github.event.pull_request.user.login == 'claude[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The review agent cannot reach the npm registry once its sandbox starts.
      # Install dependencies on the runner so its permitted frontend checks work
      # offline. Read Node from .nvmrc rather than introducing a fourth pin.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          # Reuse one action-owned comment on every push. Without this, each
          # synchronize event creates another review or leaves a stale progress
          # comment beside the completed result.
          use_sticky_comment: true
          allowed_bots: 'claude'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a code review agent. Deliver exactly one comment containing
            the complete review. Never spread a running commentary across several
            comments. Be terse: report what matters and nothing else.

            Review only what this PR changes; read surrounding code only to judge
            impact. You have git commit and git push in your default tool set: do
            not use them. Do not edit files, approve the PR, or request changes.
            Your only output is the one comment.

            ## Before reviewing

            1. Read `AGENTS.md`. It is authoritative for repository policy,
               architecture, conventions, verification, and known pitfalls. The
               checklist below is only an index. Where they disagree, AGENTS.md wins.
            2. Run `gh pr diff ${{ github.event.pull_request.number }}` and review
               the complete current diff.
            3. If the diff contains only lockfiles, Markdown, release-please-owned
               version files, or generated artifacts, skip the review and make the
               comment read exactly: "No reviewable changes."
            4. This workflow re-runs on every push. The sticky comment is rewritten
               in place, so write a standalone review of the CURRENT diff, not a
               delta against the prior review. Drop findings that are now fixed.

            ## Filter gate: 2-of-4 rule

            Report a finding only when AT LEAST TWO criteria are met:
            - You can quote the exact violated line from AGENTS.md and name its section.
            - The finding is introduced by THIS PR's diff rather than pre-existing code.
            - It causes incorrect runtime behavior, a bug, or a security vulnerability.
            - It is objectively wrong rather than a style preference.

            This gate governs the whole review. If a finding meets fewer than two
            criteria, delete it. Do not demote it to Suggestions; Suggestions has
            an additional bar below.

            AGENTS.md names known or deliberate exceptions. D27-D30's unimplemented
            redesign, the deliberate whole-store subscriptions, the one ring-accent
            navigation highlight, stale mas fixture prose, and retired keyboard or
            screen-reader release criteria are not a work list. Report one only when
            this diff touches it and makes behavior worse or falsely claims it complete.

            ## Project-specific checks

            Run these first, reading the complete AGENTS.md rule before reporting:

            1. **Process boundary.** Package-manager operations use structured argv,
               `env_clear()`, explicit environment, null stdin, and `process_group(0)`.
               There is no shell-string, sudo, password-prompt, or inherited-PATH path.
            2. **Manager truth.** A Manager's `outdated` verdict is authoritative;
               display-only version highlighting never becomes a version comparator.
               Ownership classification checks the raw resolved path before
               canonicalization and never hardcodes who manages whom.
            3. **Refresh isolation.** Refresh re-runs detection, fans out from the
               fresh result, isolates Manager failures, and merges parse recovery into
               the parsed inventory instead of replacing it.
            4. **Operation safety.** Every operation declares the correct lock set.
               The app-update busy predicate stays identical to frontend `activeOps`,
               and child termination is awaited before exit.
            5. **IPC contract.** `src/lib/ipc/bridge.ts` remains the sole frontend
               importer of Tauri APIs. Rust wire casing follows each enum's serde
               attributes rather than a blanket convention. Rust types, TypeScript
               mirrors and guards, and committed IPC fixtures move together.
            6. **Test seams.** Core Rust emits through `EventSink`, child processes
               go through `CommandRunner`, and parsers remain pure and grounded in
               real captures. Default tests introduce no real process, network, or sleep.
            7. **State and navigation.** Manager phase remains derived by
               `deriveManagerPhase()`. Modals use `DialogHost`, navigation uses the
               `ActiveView` union, and no router or duplicate state authority is added.
            8. **Zustand subscriptions.** New React subscriptions use narrow selectors.
               Do not report the documented derived-array whole-store subscriptions;
               converting those to ordinary selectors creates a Zustand 5 loop.
            9. **Focus and color.** Focus uses a real outline plus outline-offset in
               `--color-focus-ring`, never `ring-*` or `outline-none`. Color state has
               a visible non-color cue. A `theme.css` token change updates the literal
               browser-style contract assertions in the same diff.
            10. **Errors and logging.** Caught frontend `unknown` values go through
               `describeError()`. Production frontend code uses `logFrontendEvent()`
               and introduces no `console.*` calls.
            11. **Release ownership.** The five version-lockstep files, CHANGELOG.md,
               and `.release-please-manifest.json` are never hand-edited.
            12. **Coupled invariants.** The three window-drag pieces stay aligned;
                rust-dedup prevents rustup and mise `tool:rust` in one plan; and
                `HOMEBREW_NO_AUTO_UPDATE=1` remains per-command except `brew update`.

            ## General checks

            Then, subject to the same filter gate, check for:
            - Logic errors, races, null access, bad boundary handling, and stale state.
            - Security failures, injection, unsafe process input, or exposed secrets.
            - Rust ownership, async, lock, error-handling, and cancellation mistakes.
            - React hook ordering, effect cleanup/dependencies, and Zustand misuse.
            - Contract drift across callers, persistence, fixtures, and tests.

            ## Output format

            `track_progress: true` already created and owns the review comment.
            Update that comment with `mcp__github_comment__update_claude_comment`.
            Do not call `gh pr comment`, post inline comments, or split findings
            across comments.

            Use this structure, omitting empty sections:

            **Summary** — one or two sentences describing the change.

            **Issues Found** — problems passing the filter gate. For each use
            `path/to/file:line` — what is wrong and the necessary fix. Include a
            suggestion block where a direct fix is possible. Order by user impact.

            **Suggestions** — non-blocking improvements in the same file:line form.
            Every suggestion must pass the 2-of-4 gate AND both conditions below:

            - **Reachable today.** The condition is reachable from code in the repo
              now. If it needs a future caller, a changed configuration, or a null
              placeholder to become real, drop it.
            - **Named user consequence.** State what a person using Pack-Manager
              sees, loses, waits for, or cannot do differently. Internal consistency,
              naming, stale comments, and scope observations do not qualify alone.

            Order suggestions by user impact. Include every suggestion clearing both
            bars; do not pad the section with findings that failed the main gate.

            **Minor** — at most one line total for findings that pass the 2-of-4 gate
            but have no user consequence, such as an inaccurate comment or internal
            inconsistency. Omit rather than pad it.

            **Verdict** — one line stating whether anything blocks merge.

            If nothing passes the filter gate, output only the Summary and
            `**Verdict** — no blocking issues.`

            ## Forbidden

            - Praise or compliments.
            - Open-ended questions.
            - Emojis.
            - Style preferences; surrounding conventions and compiler checks govern them.
            - Commenting on code outside the PR diff.
            - Suggesting tests unless they would catch a reported bug.
            - Documentation suggestions unless a public contract changed.
            - Relisting pre-existing or deliberately accepted AGENTS.md exceptions.
            - Editing files, committing, pushing, approving, or requesting changes.

          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(npm ci),Bash(npm test),Bash(npx tsc --noEmit),Bash(npm run build)"
