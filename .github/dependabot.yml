# Version updates moved to Renovate (renovate.json). Every entry below has
# open-pull-requests-limit: 0, which stops Dependabot's version-update PRs; its
# security-update PRs (a repo setting) still run and still take their commit
# prefix, labels and directories from this file. dependabot-auto-merge.yml merges
# them; Renovate's own security PRs are off because they cannot fix a package
# that appears only in package-lock.json or Cargo.lock.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
